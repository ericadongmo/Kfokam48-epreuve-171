openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ------------------------------------------------------------
  # Opérations libres — ajoutées par le candidat
  # Réf. CAHIER_DES_CHARGES.md section 7 et section 9
  # ------------------------------------------------------------

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture une session
      description: |
        Après clôture : plus aucun dépôt ni marquage, notes figées.
        Réf. EF16 · RG9, RG12, RG16 · Q10, Q12, Q15.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, cloturee, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  cloturee: { type: boolean }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/presences/manuel:
    post:
      summary: Le formateur ajoute une présence manuellement
      description: |
        La présence est enregistrée avec source = FORMATEUR.
        Réf. EF5 · RG11 · Q14.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT

  /api/exercices/{id}/note:
    get:
      summary: L'étudiant consulte la note de son exercice
      description: |
        Retourne la note et le commentaire, jamais le relecteur.
        Réf. EF14 · RG6 · Q8.

        Évolution étape 3 (RG4/RG5 révisées, EF9bis) : chaque exercice est
        relu par jusqu'à deux relecteurs distincts. `note` est la moyenne
        des relectures rendues (`number`, non arrondie) ; `provisoire` vaut
        `true` tant que l'une des relectures assignées n'a pas encore rendu ;
        `commentaire` est celui de la dernière relecture rendue.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Note et commentaire de la relecture
          content:
            application/json:
              schema:
                type: object
                required: [statut, provisoire]
                properties:
                  statut: { type: string, enum: [EN_ATTENTE, EN_COURS, RENDUE] }
                  note: { type: number, minimum: 0, maximum: 20, nullable: true }
                  commentaire: { type: string, nullable: true }
                  provisoire:
                    type: boolean
                    description: |
                      true si au moins une des relectures assignées n'a pas
                      encore rendu sa note (évolution étape 3).
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/relectures/{id}/commencer:
    post:
      summary: Le relecteur marque sa relecture comme commencée
      description: |
        Passe la relecture au statut EN_COURS.
        Réf. RG10 · Q13.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relecture marquée EN_COURS
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [EN_ATTENTE, EN_COURS, RENDUE] }
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  # ------------------------------------------------------------
  # Opérations libres complémentaires — nécessaires aux trois écrans
  # (F2) puisque l'application n'a pas d'authentification : l'étudiant
  # choisit son nom dans une liste (Q1), le frontend a donc besoin de
  # lister promotions/étudiants, de résoudre une session par son code,
  # et de savoir ce qui est déjà déposé/assigné avant d'agir.
  # ------------------------------------------------------------

  /api/promotions:
    get:
      summary: Lister les promotions (pour le sélecteur de promotion)
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/etudiants:
    get:
      summary: Lister les étudiants d'une promotion (Q1 - choix dans une liste)
      parameters:
        - name: promotionId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom, promotionId]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    promotionId: { type: integer, format: int64 }

  /api/sessions/{id}:
    get:
      summary: Détail d'une session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Session }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/sessions/code/{code}:
    get:
      summary: Résoudre une session à partir du code donné par le formateur
      description: |
        Utilisé par les écrans étudiant/relecteur : l'étudiant a le code de
        classe, pas l'id technique de la session.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Session }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU

  /api/sessions/{id}/presences:
    get:
      summary: Lister les présences d'une session, avec le nom de l'étudiant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Présences }

  /api/sessions/{sessionId}/exercices/{etudiantId}:
    get:
      summary: Retrouver l'exercice d'un étudiant pour une session donnée
      description: |
        Utilisé par l'écran étudiant pour savoir s'il doit proposer un dépôt
        ou un remplacement de lien.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: etudiantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Exercice }
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice
      description: |
        Réf. EF15 · RG10 : refusé dès que la relecture n'est plus EN_ATTENTE.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: etudiantId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200": { description: Lien remplacé }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # ACCES_REFUSE
        "409": { $ref: "#/components/responses/Erreur" }   # REMPLACEMENT_IMPOSSIBLE

  /api/etudiants/{id}/relectures:
    get:
      summary: Lister les relectures assignées à un étudiant (écran relecteur)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: Relectures assignées }

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.